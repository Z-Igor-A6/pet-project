<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Node.js API</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; }
        .loading { color: #666; font-style: italic; }
        .error { color: red; font-weight: bold; }
        pre { background: #272822; color: #f8f8f2; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>

    <h1>Получение данных из API v\3</h1>
    
    <div id="app">
        <p class="loading">Загрузка данных...</p>
    </div>

    <script>
        // Адрес нашего запущенного Node.js сервера
        const API_URL = 'http://localhost:3000';

        async function loadData() {
            const appDiv = document.getElementById('app');
            
            try {
                // 1. Делаем запрос к серверу
                const response = await fetch(API_URL);
                
                // Проверяем, успешный ли ответ (статус 200-299)
                if (!response.ok) {
                    throw new Error(`Ошибка сервера: ${response.status}`);
                }

                // 2. Парсим JSON из ответа
                const json = await response.json();

                // 3. Отображаем данные в HTML
                appDiv.innerHTML = `
                    <div class="card">
                        <h3>Пользователь: ${json.data.username} (ID: ${json.data.userId})</h3>
                        <p><strong>Статус:</strong> ${json.message}</p>
                        <p><strong>Роли:</strong> ${json.data.roles.join(', ')}</p>
                        <small>Время ответа: ${new Date(json.timestamp).toLocaleTimeString()}</small>
                    </div>
                     
                `;

            } catch (error) {
                // Обработка ошибок (например, если сервер выключен)
                console.error('Ошибка при получении данных:', error);
                appDiv.innerHTML = `<p class="error">Не удалось загрузить данные. Убедитесь, что Node.js сервер запущен.</p>`;
            }
        }

        // Запускаем функцию при загрузке страницы
        loadData();
    </script>
</body>
</html>
